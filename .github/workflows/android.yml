name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and native tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
      - name: Build and verify
        working-directory: android
        run: bash gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-results
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/intermediates/apk/debug/*.apk
            android/app/build/reports/
          if-no-files-found: warn
